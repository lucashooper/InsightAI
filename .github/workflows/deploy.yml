# Build Insight iOS (Expo) on macOS and submit to TestFlight via Fastlane.
#
# ── Required GitHub Actions secrets ──────────────────────────────────────────
#
# App Store Connect API Key (TestFlight upload — required):
#   ASC_KEY_ID              App Store Connect → Users and Access → Keys → Key ID
#   ASC_ISSUER_ID           Issuer ID on the same page
#   ASC_KEY_CONTENT         Base64-encoded contents of the AuthKey_XXXX.p8 file
#                           (macOS: base64 -i AuthKey_XXXX.p8 | pbcopy)
#
# Code signing — Option A: Distribution certificate + provisioning profile (required if not using Match):
#   BUILD_CERTIFICATE_BASE64   Base64 of the Apple Distribution .p12
#   P12_PASSWORD               Password for the .p12 export
#   PROVISIONING_PROFILE_BASE64 Base64 of the App Store .mobileprovision for com.crupid.mobile
#   KEYCHAIN_PASSWORD          Ephemeral CI keychain password (any strong random string)
#
# Code signing — Option B: fastlane match (alternative to Option A):
#   MATCH_GIT_URL              Private git repo URL storing certs/profiles
#   MATCH_PASSWORD             Encryption password for the match repo
#   MATCH_GIT_BASIC_AUTHORIZATION  (optional) Base64 "username:token" for private match repo
#   Set repository Variable USE_FASTLANE_MATCH = true to skip manual cert/profile import steps.
#
# ── Optional secrets / variables ─────────────────────────────────────────────
#
#   APPLE_ID                   lucashooper100@outlook.com (legacy; API key is preferred)
#   APPLE_TEAM_ID              HMLV274G9F (default in Fastfile)
#   ASC_APP_ID                 6755717396  (App Store Connect app id)
#   IOS_BUNDLE_IDENTIFIER      com.crupid.mobile
#   EXPO_PUBLIC_SUPABASE_URL   Embedded at build time via app.config.js
#   EXPO_PUBLIC_SUPABASE_ANON_KEY
#   EXPO_PUBLIC_ELEVENLABS_API_KEY
#   EXPO_PUBLIC_GROQ_API_KEY
#
# ── Notes ────────────────────────────────────────────────────────────────────
# • Bump ios.buildNumber in mobile/app.config.js before each release (must exceed ASC).
# • This workflow runs `expo prebuild` because the native ios/ folder is not committed.
# • Default branch in this repo is `master`; `main` is also listed for convenience.

name: Deploy iOS to TestFlight

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional CFBundleVersion override (must be > App Store Connect latest)"
        required: false
        type: string

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  RUBY_VERSION: "3.3"
  WORKING_DIRECTORY: mobile
  IOS_BUNDLE_IDENTIFIER: com.crupid.mobile
  APPLE_TEAM_ID: HMLV274G9F
  ASC_APP_ID: "6755717396"
  USE_FASTLANE_MATCH: ${{ vars.USE_FASTLANE_MATCH }}

jobs:
  ios-testflight:
    name: Build & Submit iOS
    runs-on: macos-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: mobile

      - name: Install Node dependencies
        run: npm ci

      - name: Generate native iOS project (Expo prebuild)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ELEVENLABS_API_KEY: ${{ secrets.EXPO_PUBLIC_ELEVENLABS_API_KEY }}
          EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
          EAS_BUILD_PROFILE: production
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Resolve Xcode workspace and scheme
        id: xcode
        run: |
          WORKSPACE=$(find ios -name '*.xcworkspace' -maxdepth 2 | head -n1)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found under ios/"
            exit 1
          fi
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | ruby -rjson -e "puts JSON.parse(STDIN.read)['workspace']['schemes'].reject { |s| s.include?('Pods') }.first")
          if [ -z "$SCHEME" ]; then
            echo "Could not resolve Xcode scheme"
            exit 1
          fi
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Import Apple distribution certificate
        if: env.USE_FASTLANE_MATCH != 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        if: env.USE_FASTLANE_MATCH != 'true'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/build.mobileprovision"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build IPA and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ env.ASC_APP_ID }}
          IOS_BUNDLE_IDENTIFIER: ${{ env.IOS_BUNDLE_IDENTIFIER }}
          XCODE_WORKSPACE: ${{ steps.xcode.outputs.workspace }}
          XCODE_SCHEME: ${{ steps.xcode.outputs.scheme }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          CI: true
        run: bundle exec fastlane ios beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: mobile/build/*.ipa
          retention-days: 14
          if-no-files-found: ignore
